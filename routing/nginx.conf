limit_req_zone $binary_remote_addr zone=route_per_ip:10m rate=6r/s;
limit_conn_zone $binary_remote_addr zone=route_connections:10m;

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 64k;

    # Trust forwarded client addresses only from this Compose network.
    set_real_ip_from 172.31.0.0/24;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /route {
        limit_except POST {
            deny all;
        }

        limit_req zone=route_per_ip burst=12 nodelay;
        limit_req_status 429;
        limit_conn route_connections 8;

        proxy_pass http://valhalla:8002/route;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}

name: Arownd Preview OTA Update

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ota-preview.yml

permissions:
  contents: read

concurrency:
  group: arownd-preview-ota
  cancel-in-progress: false

jobs:
  publish-preview-ota:
    name: Publish Android preview OTA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_AUTH_CAPTCHA_ENABLED: "true"
      EXPO_PUBLIC_AUTH_CAPTCHA_CUSTOM_SIGNUP: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Validate OTA publishing configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || { echo "::error::Missing GitHub Actions secret EXPO_TOKEN"; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo "::error::Missing GitHub Actions secret EXPO_PUBLIC_SUPABASE_URL"; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Missing GitHub Actions secret EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY"; exit 1; }
          test "$EXPO_PUBLIC_AUTH_CAPTCHA_ENABLED" = "true" || { echo "::error::CAPTCHA must remain enabled for the preview OTA."; exit 1; }

      - name: Install locked mobile dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Publish Android update to preview channel
        env:
          OTA_MESSAGE: Preview OTA from commit ${{ github.sha }}
        run: npx eas-cli@latest update --channel preview --platform android --message "$OTA_MESSAGE" --non-interactive

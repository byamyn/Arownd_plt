name: Android production release (Expo EAS)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arownd-android-production-build
  cancel-in-progress: false

jobs:
  build-production:
    name: Build Android production AAB with EAS
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Expo authentication
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || {
            echo "::error::Missing repository Actions secret EXPO_TOKEN. Add an Expo access token under Settings > Secrets and variables > Actions."
            exit 1
          }

      - name: Build Android production app bundle
        run: npx --yes eas-cli build --platform android --profile production --non-interactive

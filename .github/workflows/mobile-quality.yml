name: Arownd Native quality checks
# Re-run quality checks after mobile lockfile regeneration.

on:
  push:
    branches:
      - main
      - Arownd-native-v2
      - cleanup/remove-legacy-web
      - feature/account-username
      - fix/store-pickup-address-optional
      - fix/checkout-pickup-idempotency
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-quality.yml"
      - ".github/workflows/mobile-android-preview-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arownd-mobile-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript, ESLint, Vitest and Expo Doctor
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install locked Expo mobile dependencies
        id: install
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Audit dependencies for high and critical vulnerabilities
        id: security_audit
        run: npm run audit
        continue-on-error: true

      # Run each quality check independently so one failure does not hide the others.
      - name: TypeScript
        if: always() && steps.install.outcome == 'success'
        run: npm run typecheck

      - name: ESLint
        if: always() && steps.install.outcome == 'success'
        run: npm run lint

      - name: Vitest
        if: always() && steps.install.outcome == 'success'
        run: npm test

      - name: Expo Doctor
        if: always() && steps.install.outcome == 'success'
        run: npm run doctor

      # Keep the workflow red when the audit reports vulnerabilities, after all checks ran.
      - name: Fail workflow when security audit found vulnerabilities
        if: always() && steps.security_audit.outcome == 'failure'
        run: |
          echo "::error::Dependency audit found high or critical vulnerabilities. Review the audit output above."
          exit 1

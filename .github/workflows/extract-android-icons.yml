name: Extract Android launcher assets
on:
  push:
    paths:
      - ".github/workflows/extract-android-icons.yml"
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract original archive without modifying assets
        run: |
          mkdir -p mobile/assets/android/launcher-source
          unzip -o arownd-android-adaptive-icon.zip -d mobile/assets/android/launcher-source
          test -f mobile/assets/android/launcher-source/README.txt
          find mobile/assets/android/launcher-source -type f -print
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/assets/android/launcher-source
          git commit -m "Extract original Android launcher assets"
          git push

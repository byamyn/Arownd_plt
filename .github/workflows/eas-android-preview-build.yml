name: Arownd EAS Android preview build

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/eas-android-preview-build.yml"
      - "mobile/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arownd-eas-android-preview
  cancel-in-progress: false

jobs:
  build-preview:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: android-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Validate required GitHub secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || { echo "::error::Missing GitHub Actions secret EXPO_TOKEN"; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo "::error::Missing GitHub Actions secret EXPO_PUBLIC_SUPABASE_URL"; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Missing GitHub Actions secret EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY"; exit 1; }

      - name: Install locked mobile dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build preview APK with EAS
        run: npx --yes eas-cli build --platform android --profile preview --non-interactive --wait

      - name: Download completed APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          BUILD_ID="$(npx --yes eas-cli build:list --platform android --build-profile preview --limit 1 --json | jq -r '.[0].id // empty')"
          test -n "$BUILD_ID" || { echo "::error::Could not determine the completed EAS preview build ID"; exit 1; }

          npx --yes eas-cli build:download --build-id "$BUILD_ID" --non-interactive
          DOWNLOADED_APK="$(find . -maxdepth 2 -type f -name '*.apk' -print -quit)"
          test -n "$DOWNLOADED_APK" || { echo "::error::EAS did not download an APK"; exit 1; }
          cp "$DOWNLOADED_APK" ./dist/arownd-android.apk
          test -s ./dist/arownd-android.apk

      - name: Publish APK to GitHub Releases
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "Arownd Android APK" --notes "أحدث نسخة APK الرسمية لتطبيق Arownd. يتم تحديث هذا الإصدار عند كل بناء ناجح."
          fi
          gh release upload "$RELEASE_TAG" ./dist/arownd-android.apk --repo "$GITHUB_REPOSITORY" --clobber
          echo "APK published: https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/arownd-android.apk"
